name: Update APK download badge

on:
  schedule:
    - cron: '23 4 * * *'
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['.github/workflows/apk-downloads.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-download-badge

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Count published APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          counts=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -c --arg latest_tag "$latest_tag" '
              def apk_downloads:
                [.[] | .assets[] | select(.name | ascii_downcase | endswith(".apk")) | .download_count] | add // 0;
              [.[][] | select(.draft == false)] |
              {latest: (map(select(.tag_name == $latest_tag)) | apk_downloads), total: apk_downloads}')
          content=$(printf '%s\n' "$counts" | base64 -w 0)
          endpoint="repos/$GITHUB_REPOSITORY/contents/assets/apk-downloads.json"
          existing=$(gh api "$endpoint")
          if [[ $(jq -r '.content' <<< "$existing" | tr -d '\n') == "$content" ]]; then
            echo "APK download counts already up to date. $counts"
            exit 0
          fi
          sha=$(jq -r '.sha' <<< "$existing")
          gh api --method PUT "$endpoint" --silent -f message='Update APK download badge' -f sha="$sha" -f content="$content"
          echo "Updated APK download counts. $counts"
